upstream dashboard_upstream { server dashboard-dev:5173; }
upstream api_upstream       { server api-dev:4000; }
upstream edge_upstream      { server edge-worker-dev:8787; }

server {
    listen 80;
    server_name _;
    # Relative Location headers — nginx listens on 80 inside the container but is
    # published on :3200, so absolute redirects would drop the host port.
    absolute_redirect off;

    # The router's own liveness probe, independent of upstream health.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Control plane. apps/dashboard/src/api/client.ts calls /api/* and the API
    # serves /v1/* at its ROOT, so the prefix is stripped here — identical
    # semantics to the vite dev proxy's rewrite in apps/dashboard/vite.config.ts.
    # Keep the two in sync.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Delivery plane — the public read API SDKs consume (apps/edge-worker/API.md).
    # Exposed same-origin so browser fetches and SDK demos skip CORS in dev.
    location /edge/ {
        rewrite ^/edge/(.*)$ /$1 break;
        proxy_pass http://edge_upstream;
        proxy_set_header Host $host;
    }

    # The dashboard dev server owns the origin root. proxy_http_version 1.1 plus
    # the Upgrade/Connection pair is what lets Vite's HMR websocket through.
    location / {
        proxy_pass http://dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
