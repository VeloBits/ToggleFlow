upstream dashboard_upstream { server dashboard-prod:8080; }
upstream api_upstream       { server api-prod:4000; }

server {
    listen 80;
    server_name _;
    # Relative Location headers - nginx listens on 80 inside the container but is
    # published on :3200, so absolute redirects would drop the host port.
    absolute_redirect off;

    # The router's own liveness probe, independent of upstream health.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Security headers. `always` emits them on error responses too.
    #
    # No Strict-Transport-Security: this stack is plain HTTP on localhost, and
    # HSTS on a localhost origin would poison every other localhost service in
    # the browser for a year.
    #
    # The Keycloak origin below duplicates the VITE_KEYCLOAK_URL build arg in
    # docker-compose.yml - change one and you must change the other, or
    # oidc-client-ts's token exchange is blocked by CSP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080; frame-src 'self' http://localhost:8080; form-action 'self' http://localhost:8080" always;

    # Control plane - same prefix strip as the dev conf.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The delivery plane runs on Cloudflare in production
    # (`npm run deploy -w @toggleflow/edge-worker`), so there is no upstream for
    # it here - the edge worker container exists only in the dev profile.
    #
    # This must be an explicit 404. Without it the request falls through to
    # `location /`, hits the dashboard's SPA fallback, and an SDK pointed at this
    # origin gets index.html with a 200 - a JSON parse error somewhere far from
    # the actual mistake instead of a clear "wrong host".
    location /edge/ {
        access_log off;
        add_header Content-Type application/json always;
        return 404 "{\"error\":\"not_found\",\"message\":\"the delivery plane is not served by this origin in production\"}\n";
    }

    # The dashboard's static container serves dist/ with an index.html SPA
    # fallback (react-router-dom v7 owns history routing), so it takes everything
    # not matched above.
    #
    # docker/nginx.static.conf sets these three itself, for the case where that
    # image is served directly. Behind this router they would arrive twice, and a
    # duplicated security header is treated as malformed by some browsers - drop
    # the upstream's copies so the server-level add_header directives above are
    # the only ones the client sees.
    location / {
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://dashboard_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
