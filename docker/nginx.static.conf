server {
    listen 8080;
    # Also bind ::1 - the compose healthcheck's busybox wget resolves localhost to
    # ::1 first and does not fall back to IPv4 on connection refusal.
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets - cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - react-router-dom v7 owns /tools, /segments, /audit and
    # /auth/callback client-side, so a hard refresh or an OIDC redirect landing on
    # a deep link must not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json image/svg+xml;

    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
