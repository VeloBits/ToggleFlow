<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      This is a Vite SPA: the guest landing page is the crawlable surface, so its
      metadata is static here rather than injected at runtime. Keep it in step
      with the copy in src/pages/GuestHomePage.tsx.
    -->
    <title>ToggleFlow - Feature Flags &amp; Remote Configuration Platform</title>
    <meta
      name="description"
      content="ToggleFlow is a feature flag and remote configuration platform for developers. Ship behind flags, run progressive rollouts and canary releases - no redeploy."
    />
    <link rel="canonical" href="https://toggleflow.dev/" />

    <!--
      Matches `--bg` in @velobits-dev/tokens/tokens.css so the browser chrome
      follows the theme. Keep in step with that file if the page surface moves.
    -->
    <meta name="theme-color" content="#f4edea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151615" media="(prefers-color-scheme: dark)" />

    <!--
      Applies the stored theme BEFORE first paint, so a dark-mode user does not
      get a frame of the cream page on every load. Without it the theme lands
      only once React boots, which on a cold cache is a visible white flash.

      This is a verbatim copy of what `themeInitScript(THEME_STORAGE_KEYS.dashboard)`
      from `@velobits-dev/ui/theme` emits — inlined because a static Vite
      `index.html` cannot call into a module, and `type="module"` scripts are
      deferred, i.e. too late to beat the paint. The runtime `ThemeProvider`
      takes over immediately after and also mirrors the class onto `<body>`
      (the token file keys dark mode on `.dark, body.dark`, so either element
      works; the init script only needs the one it can reach).

      If the storage key or the resolution rule ever changes in the design
      system, this line has to change with it.
    -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('tf.theme');
          var d =
            m === 'dark' ||
            ((m === 'system' || !m) && matchMedia('(prefers-color-scheme: dark)').matches);
          var h = document.documentElement;
          h.classList.toggle('dark', d);
          h.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ToggleFlow" />
    <meta property="og:url" content="https://toggleflow.dev/" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="ToggleFlow - Feature Flags &amp; Remote Configuration Platform"
    />
    <meta
      property="og:description"
      content="Feature management for tool-heavy apps: kill switches, progressive rollouts, targeting, and versioned remote config - changed from a dashboard, live in seconds."
    />

    <!-- `summary`, not `summary_large_image`: there is no share image asset yet. -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="ToggleFlow - Feature Flags &amp; Remote Configuration Platform"
    />
    <meta
      name="twitter:description"
      content="Feature management for tool-heavy apps: kill switches, progressive rollouts, targeting, and versioned remote config - changed from a dashboard, live in seconds."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "ToggleFlow",
            "url": "https://toggleflow.dev/",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Web",
            "description": "A feature flag and remote configuration platform: register your tools and features once, then toggle them, roll them out progressively, and edit their configuration live from a dashboard - no redeploy.",
            "featureList": [
              "Feature flags and kill switches with a defined fallback",
              "Percentage-based progressive rollouts and canary releases",
              "Targeting by segment, plan, or region",
              "Versioned remote configuration with diff and one-click rollback",
              "Per-environment scoped API keys, roles, and a full audit trail",
              "JavaScript and TypeScript SDK plus a plain REST API"
            ],
            "publisher": { "@id": "https://toggleflow.dev/#velobits" }
          },
          {
            "@type": "Organization",
            "@id": "https://toggleflow.dev/#velobits",
            "name": "VeloBits",
            "url": "https://velobits.dev",
            "brand": { "@type": "Brand", "name": "ToggleFlow" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
